<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧠 Кликер: Эволюция Нейросетей v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border-radius: 30px;
            padding: 20px;
            height: 95vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .screen { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .hidden { display: none !important; }

        /* МЕНЮ */
        .menu-title { text-align: center; font-size: 28px; font-weight: bold; color: #ffd966; margin-top: 50px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255, 217, 102, 0.5); }
        .menu-version { text-align: center; font-size: 14px; color: #94a3b8; margin-bottom: 50px; }
        .menu-btn { background: #334155; color: white; border: 2px solid #475569; border-radius: 20px; padding: 15px; font-size: 18px; font-weight: bold; margin-bottom: 15px; cursor: pointer; transition: 0.1s; }
        .menu-btn:active { transform: scale(0.95); background: #475569; }
        .menu-btn.primary { background: #2563eb; border-color: #3b82f6; }

        /* ИГРА */
        .top-bar { display: flex; justify-content: space-between; background: #0f172a; padding: 15px; border-radius: 20px; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .brain-container { flex: 1; display: flex; justify-content: center; align-items: center; }
        .brain { width: 180px; height: 180px; background: linear-gradient(135deg, #ff9900, #ff5500); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 80px; cursor: pointer; box-shadow: 0 15px 0 #aa3300, 0 0 30px rgba(255, 85, 0, 0.5); transition: 0.05s; }
        .brain:active { transform: scale(0.95) translateY(10px); box-shadow: 0 5px 0 #aa3300; }
        .click-hint { text-align: center; font-size: 24px; font-weight: bold; color: #ffd966; margin-bottom: 20px; }

        /* МАГАЗИН */
        .shop-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #cbd5e1; }
        .shop-list { flex: 1; overflow-y: auto; padding-right: 5px; }
        .shop-list::-webkit-scrollbar { width: 0; }
        .shop-item { background: #0f172a; border: 1px solid #334155; border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .shop-item:active { background: #1e293b; }
        .shop-name { font-weight: bold; font-size: 16px; }
        .shop-power { font-size: 12px; color: #94a3b8; }
        .shop-price { background: #334155; padding: 5px 10px; border-radius: 10px; font-weight: bold; color: #ffd966; font-size: 14px; }
        .shop-item.owned { opacity: 0.5; pointer-events: none; }

        .bottom-bar { display: flex; gap: 10px; margin-top: 10px; }
        .back-btn { flex: 1; background: #334155; color: white; border: none; border-radius: 15px; padding: 15px; font-weight: bold; cursor: pointer; }
        .reset-btn { flex: 1; background: #7f1d1d; color: white; border: none; border-radius: 15px; padding: 15px; font-weight: bold; cursor: pointer; }

        /* МОДАЛКИ */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 100; padding: 20px; }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
        .modal-btn { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 15px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="mainMenu" class="screen">
            <div class="menu-title">🧠 КЛИКЕР: ЭВОЛЮЦИЯ</div>
            <div class="menu-version" id="menuVersion">v1.0.0</div>
            
            <button class="menu-btn primary" onclick="startGame()">🎮 ИГРАТЬ</button>
            <button class="menu-btn" onclick="openModal('newsModal')">📢 НОВОСТИ</button>
            <button class="menu-btn" onclick="openModal('settingsModal')">⚙️ НАСТРОЙКИ</button>
        </div>

        <!-- ИГРА -->
        <div id="gameInterface" class="screen hidden">
            <div class="top-bar">
                <div>🧠 <span id="pointsDisplay">0</span></div>
                <div>⚡ <span id="powerDisplay">1</span></div>
            </div>
            
            <div class="brain-container">
                <div id="clickableBrain" class="brain">🧠</div>
            </div>
            <div class="click-hint" id="clickHint">+1</div>

            <div class="shop-title">🧬 НЕЙРОСЕТИ</div>
            <div id="shopList" class="shop-list"></div>

            <div class="bottom-bar">
                <button class="back-btn" onclick="goToMenu()">◀ В МЕНЮ</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА НОВОСТЕЙ -->
    <div id="newsModal" class="modal">
        <div class="modal-content">
            <h2>📢 НОВОСТИ</h2>
            <p style="margin-top:10px; font-size:14px; line-height:1.5;">Привет! Это новая версия игры. Мы полностью переписали код, чтобы избавиться от багов. Теперь всё работает идеально, а прогресс <b>не сбрасывается</b> при обновлениях.</p>
            <button class="modal-btn" onclick="closeModal('newsModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>⚙️ НАСТРОЙКИ</h2>
            <button class="modal-btn" style="background:#7f1d1d; border:2px solid #ef4444;" onclick="resetProgress()">⚠️ СБРОСИТЬ ПРОГРЕСС</button>
            <button class="modal-btn" onclick="closeModal('settingsModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        // ===== ВЕРСИЯ =====
        const GAME_VERSION = "1.0.0";
        const SAVE_KEY = "neural_evo_v2_save";

        // ===== ДАННЫЕ =====
        let points = 0;
        let power = 1;
        
        // Список нейросетей (название, множитель силы, цена)
        const upgrades = [
            { id: 0, name: "🤖 Перцептрон", power: 1, price: 20, bought: false },
            { id: 1, name: "🧬 Сверточная", power: 5, price: 100, bought: false },
            { id: 2, name: "⚙️ Трансформер", power: 15, price: 500, bought: false },
            { id: 3, name: "🌌 Глубокий мозг", power: 50, price: 2500, bought: false },
            { id: 4, name: "🌀 Сингулярность", power: 200, price: 10000, bought: false }
        ];

        // ===== ЭЛЕМЕНТЫ DOM =====
        const menu = document.getElementById('mainMenu');
        const game = document.getElementById('gameInterface');
        const brain = document.getElementById('clickableBrain');
        const pointsDisplay = document.getElementById('pointsDisplay');
        const powerDisplay = document.getElementById('powerDisplay');
        const clickHint = document.getElementById('clickHint');
        const shopList = document.getElementById('shopList');

        // ===== ФУНКЦИИ =====
        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
            return Math.floor(num).toString();
        }

        function updateUI() {
            pointsDisplay.innerText = formatNumber(points);
            powerDisplay.innerText = formatNumber(power);
            clickHint.innerText = "+" + formatNumber(power);
            renderShop();
        }

        function renderShop() {
            shopList.innerHTML = '';
            upgrades.forEach(u => {
                const isBought = u.bought;
                const canAfford = points >= u.price;
                
                const div = document.createElement('div');
                div.className = `shop-item ${isBought ? 'owned' : ''}`;
                div.innerHTML = `
                    <div>
                        <div class="shop-name">${u.name}</div>
                        <div class="shop-power">+${u.power} к силе</div>
                    </div>
                    <div class="shop-price">${isBought ? '✅ Куплено' : '💰 ' + formatNumber(u.price)}</div>
                `;
                
                if (!isBought) {
                    div.onclick = () => buyUpgrade(u);
                }
                shopList.appendChild(div);
            });
        }

        function buyUpgrade(u) {
            if (points >= u.price && !u.bought) {
                points -= u.price;
                u.bought = true;
                power += u.power;
                updateUI();
                saveGame();
            }
        }

        // Клик по мозгу
        brain.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            points += power;
            updateUI();
            saveGame();
            
            // Анимация
            brain.style.transform = 'scale(0.9)';
            setTimeout(() => brain.style.transform = '', 50);
        });

        // ===== НАВИГАЦИЯ =====
        function startGame() {
            menu.classList.add('hidden');
            game.classList.remove('hidden');
            updateUI();
        }

        function goToMenu() {
            game.classList.add('hidden');
            menu.classList.remove('hidden');
        }

        // ===== МОДАЛКИ =====
        function openModal(id) { document.getElementById(id).classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }
        
        function resetProgress() {
            if (confirm("Точно сбросить ВЕСЬ прогресс?")) {
                localStorage.removeItem(SAVE_KEY);
                location.reload();
            }
        }

        // ===== СОХРАНЕНИЕ =====
        function saveGame() {
            const saveData = {
                version: GAME_VERSION,
                points: points,
                power: power,
                upgrades: upgrades.map(u => ({ id: u.id, bought: u.bought }))
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
        }

        function loadGame() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (!saved) return;

            try {
                const data = JSON.parse(saved);
                
                // ЗАЩИТА ОТ СБРОСА: берем старые данные, если их нет - оставляем 0 или 1
                points = data.points !== undefined ? data.points : 0;
                power = data.power !== undefined ? data.power : 1;
                
                if (data.upgrades) {
                    data.upgrades.forEach(savedUp => {
                        const localUp = upgrades.find(u => u.id === savedUp.id);
                        if (localUp) localUp.bought = savedUp.bought;
                    });
                }
            } catch (e) {
                console.error("Ошибка загрузки сохранения", e);
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.getElementById('menuVersion').innerText = "v" + GAME_VERSION;
        loadGame();
        updateUI();
        saveGame(); // Сразу сохраняем, чтобы зафиксировать версию

    </script>
</body>
</html>
