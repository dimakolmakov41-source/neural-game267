<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧠 Кликер: Эволюция Нейросетей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: white;
            text-shadow: 0 0 5px black;
            overflow-x: hidden;
            background: linear-gradient(145deg, #f5e6b0, #d4a373); /* Тот самый дефолтный фон */
        }

        .game-container {
            width: 100%; 
            max-width: 420px;
            background: rgba(18, 28, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            border: 1px solid rgba(100, 180, 255, 0.3);
            padding: 20px 16px; 
            margin: 0 auto; 
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .top-bar { 
            background: rgba(0, 10, 20, 0.7); 
            border-radius: 60px; 
            padding: 10px 20px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            font-size: 18px;
            font-weight: bold;
        }

        .brain-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 30px 0 40px; 
            position: relative; 
        }

        .brain { 
            width: 180px; 
            height: 180px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: 0.08s; 
            background: radial-gradient(circle at 30% 30%, #ffaa00, #ff5500); 
            box-shadow: 0 15px 0 #aa4400, 0 0 30px #ffaa00; 
            border: 3px solid #ffffaa; 
            position: relative; 
            animation: brainFloat 2s ease-in-out infinite; 
        }

        .brain:active { 
            transform: scale(0.96); 
            box-shadow: 0 8px 0 #aa4400; 
        }

        @keyframes brainFloat { 
            0%,100% { transform: translateY(0px); } 
            50% { transform: translateY(-5px); } 
        }

        .brain .skin-emoji { 
            font-size: 80px; 
            z-index: 2; 
        }

        .brain .eyes { 
            position: absolute; 
            width: 100%; 
            top: 50%; 
            transform: translateY(-50%); 
            display: flex; 
            justify-content: space-between; 
            padding: 0 35px; 
            pointer-events: none; 
            z-index: 3;
        }

        .eye { 
            width: 24px; 
            height: 24px; 
            background: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .pupil { 
            width: 12px; 
            height: 12px; 
            background: black; 
            border-radius: 50%; 
            transition: transform 0.05s; 
        }

        .click-hint { 
            position: absolute; 
            bottom: -30px; 
            font-size: 24px; 
            font-weight: 900; 
            color: #ffdd44; 
            text-shadow: 0 0 10px #ff8800; 
        }

        .shop-panel { 
            background: rgba(0,0,0,0.6); 
            border-radius: 30px; 
            padding: 15px; 
        }

        .shop-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffd966;
            margin-bottom: 10px;
        }

        .shop-list { 
            max-height: 250px; 
            overflow-y: auto; 
            padding-right: 5px;
        }

        .shop-list::-webkit-scrollbar { width: 6px; }
        .shop-list::-webkit-scrollbar-thumb { background: #ffaa00; border-radius: 10px; }

        .shop-item { 
            background: #1a3150; 
            border-radius: 30px; 
            padding: 12px 16px; 
            margin: 6px 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.1s;
        }

        .shop-item:hover { background: #2a4160; transform: scale(1.02); }
        .shop-item.bought { background: #1a5a20; cursor: default; opacity: 0.7; }
        .shop-item.bought:hover { transform: none; }

        .float-text { 
            position: fixed; 
            pointer-events: none; 
            z-index: 1500; 
            font-size: 28px; 
            font-weight: 900; 
            color: #ffdd44; 
            text-shadow: 0 0 10px #ff8800, 0 0 20px #ff4400; 
            animation: floatUp 0.8s ease-out forwards; 
        }

        @keyframes floatUp { 
            0% { opacity: 1; transform: translateY(0) scale(1); } 
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); } 
        }

        .save-badge { 
            text-align: center; 
            color: #a0ffc0; 
            font-size: 10px; 
            margin-top: 15px; 
        }

        @media (min-width: 900px) {
            .game-container { max-width: 500px; }
            .brain { width: 220px; height: 220px; }
            .brain .skin-emoji { font-size: 100px; }
            .shop-list { max-height: 350px; }
            .top-bar { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="top-bar">
            <div>🧠 <span id="points">0</span></div>
            <div>⚡ <span id="power">1</span></div>
        </div>

        <div class="brain-container">
            <div id="clickableObject" class="brain">
                <span class="skin-emoji">🧠</span>
                <div class="eyes">
                    <div class="eye"><div class="pupil"></div></div>
                    <div class="eye"><div class="pupil"></div></div>
                </div>
            </div>
            <div class="click-hint" id="clickHint">+1</div>
        </div>

        <div class="shop-panel">
            <div class="shop-title">🧬 НЕЙРОСЕТИ</div>
            <div id="shopList" class="shop-list"></div>
        </div>
        
        <div class="save-badge">💾 автосохранение включено</div>
    </div>

    <script>
        // ===== НАСТРОЙКИ =====
        let points = 0;
        let clickPower = 1;
        let lastSaveTime = Date.now();

        // 10 Нейросетей от Перцептрона
        const networks = [
            { name: "Перцептрон", basePrice: 20, power: 1, purchased: false },
            { name: "Нейро-искра", basePrice: 100, power: 2, purchased: false },
            { name: "Сверточная", basePrice: 500, power: 5, purchased: false },
            { name: "Рекуррентная", basePrice: 2500, power: 12, purchased: false },
            { name: "Трансформер", basePrice: 10000, power: 30, purchased: false },
            { name: "Квантовая", basePrice: 50000, power: 80, purchased: false },
            { name: "GPT-клик", basePrice: 250000, power: 200, purchased: false },
            { name: "Автокодировщик", basePrice: 1000000, power: 500, purchased: false },
            { name: "DALL-E", basePrice: 5000000, power: 1500, purchased: false },
            { name: "Глубокий мозг", basePrice: 25000000, power: 5000, purchased: false }
        ];

        // Форматирование чисел
        function formatNumber(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9)  return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6)  return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3)  return (num / 1e3).toFixed(2) + 'K';
            return Math.floor(num).toString();
        }

        // Отрисовка магазина
        function renderShop() {
            const list = document.getElementById('shopList');
            list.innerHTML = '';
            
            networks.forEach((net, index) => {
                const div = document.createElement('div');
                div.className = `shop-item ${net.purchased ? 'bought' : ''}`;
                
                if (net.purchased) {
                    div.innerHTML = `<span>${net.name} +${net.power}</span><span>✅ Куплено</span>`;
                } else {
                    div.innerHTML = `<span>${net.name} +${net.power}</span><span>💰 ${formatNumber(net.basePrice)}</span>`;
                    div.onclick = () => buyNetwork(index);
                }
                list.appendChild(div);
            });
        }

        // Покупка сети
        function buyNetwork(index) {
            const net = networks[index];
            if (points >= net.basePrice && !net.purchased) {
                points -= net.basePrice;
                net.purchased = true;
                clickPower += net.power;
                updateUI();
                saveGame();
            }
        }

        // Клик по мозгу
        function handleClick(e) {
            points += clickPower;
            updateUI();
            saveGame();
            
            const brain = document.getElementById('clickableObject');
            brain.style.transform = 'scale(0.92)';
            setTimeout(() => brain.style.transform = '', 100);
            
            // Всплывающий текст (поддержка мыши и тача)
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = `+${formatNumber(clickPower)}`;
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Глаза следят за курсором
        function moveEyes(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            document.querySelectorAll('.pupil').forEach(p => {
                const rect = p.parentElement.parentElement.getBoundingClientRect();
                const dx = x - (rect.left + rect.width / 2);
                const dy = y - (rect.top + rect.height / 2);
                const ang = Math.atan2(dy, dx);
                const dist = Math.min(4, Math.hypot(dx, dy) / 20);
                p.style.transform = `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist}px)`;
            });
        }

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('points').innerText = formatNumber(points);
            document.getElementById('power').innerText = formatNumber(clickPower);
            document.getElementById('clickHint').innerText = `+${formatNumber(clickPower)}`;
            renderShop();
        }

        // Сохранение
        function saveGame() {
            lastSaveTime = Date.now();
            localStorage.setItem('neuralClickerCleanSave', JSON.stringify({
                points, clickPower, networks, lastSaveTime
            }));
        }

        // Загрузка
        function loadGame() {
            const saved = localStorage.getItem('neuralClickerCleanSave');
            if (saved) {
                try {
                    const d = JSON.parse(saved);
                    points = d.points || 0;
                    clickPower = d.clickPower || 1;
                    if (d.networks) {
                        d.networks.forEach((n, i) => {
                            if(networks[i]) networks[i].purchased = n.purchased;
                        });
                    }
                    
                    // Оффлайн доход (макс 2 часа)
                    if (d.lastSaveTime) {
                        const awaySec = Math.min((Date.now() - d.lastSaveTime) / 1000, 7200);
                        if (awaySec > 60) {
                            const offlineIncome = Math.floor(clickPower * awaySec * 0.1); 
                            if (offlineIncome > 0) {
                                points += offlineIncome;
                                setTimeout(() => alert(`📴 С возвращением! Пока тебя не было, накапало: +${formatNumber(offlineIncome)} 🧠`), 500);
                            }
                        }
                    }
                } catch(e) {}
            }
            updateUI();
        }

        // Инициализация
        window.onload = () => {
            loadGame();
            document.getElementById('clickableObject').addEventListener('pointerdown', handleClick);
            document.addEventListener('mousemove', moveEyes);
            document.addEventListener('touchmove', moveEyes);
            setInterval(saveGame, 5000);
        };
    </script>
</body>
</html>
